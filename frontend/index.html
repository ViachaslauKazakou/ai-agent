<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>AI Agent</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">LOCAL WORKSPACE</p>
          <h1>AI Agent</h1>
        </div>
        <span id="status" class="status">Starting service…</span>
      </header>

      <section class="workspace">
        <aside class="sidebar">
          <div class="panel-heading">
            <span>Project</span>
            <button id="refresh" class="icon-button" type="button" title="Refresh capabilities">↻</button>
          </div>
          <label class="field-label" for="project-path">Project path</label>
          <div class="path-picker">
            <input id="project-path" type="text" value="." autocomplete="off" />
            <button id="choose-project" class="secondary-button path-button" type="button">Choose…</button>
          </div>
          <button id="open-project" class="primary-button" type="button">Open project</button>
          <label class="field-label session-label" for="model">Model</label>
          <input id="model" type="text" value="demo-model" autocomplete="off" />
          <button id="create-session" class="secondary-button" type="button" disabled>Create session</button>
          <div class="meta-card">
            <span class="meta-label">API</span>
            <strong id="api-version">—</strong>
          </div>
          <div class="meta-card">
            <span class="meta-label">Capabilities</span>
            <strong id="capabilities">—</strong>
          </div>
          <div class="meta-card">
            <span class="meta-label">Models</span>
            <div id="models" class="model-list" aria-label="Available models">
              <span class="empty-state">Open a project to load models</span>
            </div>
          </div>
          <div class="meta-card">
            <span class="meta-label">Session</span>
            <strong id="session">Not created</strong>
          </div>
        </aside>

        <section class="chat-panel">
          <div id="messages" class="messages" aria-live="polite">
            <article class="message assistant">
              <span class="message-label">SYSTEM</span>
              <p>Open a local project to verify the desktop application service.</p>
            </article>
          </div>
          <details class="trace-panel" open>
            <summary>Execution log</summary>
            <pre id="trace" class="trace" aria-live="polite"></pre>
          </details>
          <form id="composer" class="composer">
            <input id="prompt" type="text" placeholder="Ask the agent about this project…" disabled />
            <button id="send" type="submit" disabled>Send</button>
          </form>
        </section>
      </section>
    </main>
    <script>
      // Keep startup failures visible in the window. A module import can fail
      // before app.js runs, which otherwise leaves the initial status frozen.
      window.reportFrontendError = (error) => {
        const status = document.querySelector("#status");
        if (status) status.textContent = `Frontend error: ${String(error)}`;
      };
      window.addEventListener("error", (event) => {
        window.reportFrontendError(event.error?.message || event.message);
      });
      window.addEventListener("unhandledrejection", (event) => {
        window.reportFrontendError(event.reason);
      });
    </script>
    <script type="module" src="./app.js" onerror="window.reportFrontendError('failed to load app.js')"></script>
  </body>
</html>
