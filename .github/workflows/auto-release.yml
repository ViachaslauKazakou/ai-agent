name: 🚀 Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: Type of release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  MANIFEST_PATH: Cargo.toml

jobs:
  auto-release:
    name: 🏷️ Create Auto Release
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.event.head_commit != null &&
        !contains(github.event.head_commit.message, '[skip-ci]')
      )

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: 🦀 Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt

      - name: 📦 Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      - name: 🏷️ Fetch all tags
        run: |
          git fetch --tags --force
          echo "📋 Existing tags:"
          git tag -l | sort -V

      - name: 📖 Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' "$MANIFEST_PATH" | head -n 1)
          if [ -z "$CURRENT_VERSION" ]; then
            echo "Could not read package version from $MANIFEST_PATH" >&2
            exit 1
          fi
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Current version: $CURRENT_VERSION"

      - name: 🎯 Determine release type
        id: release_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TYPE="${{ inputs.release_type }}"
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$LAST_TAG" ]; then
              COMMIT_RANGE="$LAST_TAG..HEAD"
            else
              COMMIT_RANGE="HEAD"
            fi

            if git log --format=%s "$COMMIT_RANGE" | grep -qiE '(^|[^a-z])(breaking|major):'; then
              RELEASE_TYPE="major"
            elif git log --format=%s "$COMMIT_RANGE" | grep -qiE '(^|[^a-z])(feat|feature):'; then
              RELEASE_TYPE="minor"
            else
              RELEASE_TYPE="patch"
            fi
          fi

          echo "type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          echo "🎯 Release type: $RELEASE_TYPE"

      - name: 🧮 Calculate new version
        id: new_version
        env:
          CURRENT_VERSION: ${{ steps.current_version.outputs.version }}
          RELEASE_TYPE: ${{ steps.release_type.outputs.type }}
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          LAST_VERSION="${LAST_TAG#v}"
          if [ -n "$LAST_TAG" ] \
            && [ "$CURRENT_VERSION" != "$LAST_VERSION" ] \
            && [ "$(printf '%s\n' "$LAST_VERSION" "$CURRENT_VERSION" | sort -V | tail -n 1)" = "$CURRENT_VERSION" ]; then
            # A previous run already prepared a Cargo.toml bump PR. Once that
            # PR is merged, release the version stored in Cargo.toml instead
            # of incrementing it a second time.
            NEW_VERSION="$CURRENT_VERSION"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            case "$RELEASE_TYPE" in
              major)
                MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1)); PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
              *)
                echo "Unsupported release type: $RELEASE_TYPE" >&2
                exit 1
                ;;
            esac
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          while git show-ref --tags --verify --quiet "refs/tags/v$NEW_VERSION"; do
            PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          done

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "🚀 New version: $NEW_VERSION"

      - name: ✏️ Update Cargo version
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          manifest = Path(os.environ["MANIFEST_PATH"])
          new_version = os.environ["NEW_VERSION"]
          content = manifest.read_text()
          updated, replacements = re.subn(
              r'(?m)^(version = ")[0-9][0-9.]+("$)',
              rf'\g<1>{new_version}\g<2>',
              content,
              count=1,
          )
          if replacements != 1:
              raise SystemExit(f"Expected one package version in {manifest}")
          manifest.write_text(updated)
          PY
          cargo check --manifest-path "$MANIFEST_PATH"

      - name: 📝 Open Cargo version bump PR
        id: version_bump
        uses: peter-evans/create-pull-request@v8
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/bump-cargo-version-${{ steps.new_version.outputs.version }}
          delete-branch: true
          commit-message: "chore: bump version to ${{ steps.new_version.outputs.version }}"
          title: "chore: bump Cargo version to ${{ steps.new_version.outputs.version }}"
          body: |
            Automated version bump for release `v${{ steps.new_version.outputs.version }}`.

            This PR is created because `main` requires all changes to go through a pull request.
          add-paths: |
            ${{ env.MANIFEST_PATH }}

      - name: ✅ Validate and build
        if: steps.version_bump.outputs.pull-request-number == ''
        run: |
          cargo fmt --all -- --check
          cargo test --all-targets
          cargo build --release --locked

      - name: 📦 Package Linux binary
        if: steps.version_bump.outputs.pull-request-number == ''
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
        run: |
          ARCHIVE="ai-agent-v${NEW_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -C target/release -czf "$ARCHIVE" ai-agent
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
        id: package

      - name: 📝 Generate changelog
        if: steps.version_bump.outputs.pull-request-number == ''
        id: changelog
        env:
          CURRENT_VERSION: ${{ steps.current_version.outputs.version }}
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            COMMIT_RANGE="$LAST_TAG..HEAD"
          else
            COMMIT_RANGE="HEAD"
          fi
          {
            echo "## Changes"
            echo
            git log --format='- %s (%h)' "$COMMIT_RANGE"
          } > CHANGELOG.md
          {
            echo 'body<<EOF'
            cat CHANGELOG.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: 🎉 Create GitHub Release
        if: steps.version_bump.outputs.pull-request-number == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
          RELEASE_TYPE: ${{ steps.release_type.outputs.type }}
          CURRENT_VERSION: ${{ steps.current_version.outputs.version }}
          RELEASE_BODY: ${{ steps.changelog.outputs.body }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          cat > release-notes.md <<EOF
          # 🚀 AI Agent v${NEW_VERSION}

          **Release type:** \\`${RELEASE_TYPE}\\`
          **Previous version:** \\`v${CURRENT_VERSION}\\`

          ${RELEASE_BODY}

          ## Installation

          Download the \\`${ARCHIVE}\\` asset for Linux x86_64.
          EOF
          gh release create "v${NEW_VERSION}" "$ARCHIVE" \
            --title "🚀 Release v${NEW_VERSION}" \
            --notes-file release-notes.md

      - name: 📊 Summary
        if: steps.version_bump.outputs.pull-request-number == ''
        run: |
          {
            echo "## 🎉 Release Summary"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Previous version | \`v${{ steps.current_version.outputs.version }}\` |"
            echo "| New version | \`v${{ steps.new_version.outputs.version }}\` |"
            echo "| Release type | \`${{ steps.release_type.outputs.type }}\` |"
            echo "| Artifact | \`${{ steps.package.outputs.archive }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
